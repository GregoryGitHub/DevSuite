[package]
name = "todo-rs"
version = "1.2.3"
edition = "2021"
description = "Lightweight todo list running in the Windows tray"

# CLI `devsuite` (cli/): binário de console que conversa com o app pelo named pipe/socket.
[workspace]
members = ["cli"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "rustls-tls-native-roots", "http2", "charset", "multipart", "gzip", "brotli", "deflate", "cookies"] }
base64 = "0.22"
tokio = { version = "1", features = ["sync", "macros", "net", "rt", "time", "io-util"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# Cliente de banco de dados (aba "Banco"): SQL Server / Azure SQL via TDS em Rust puro.
tiberius = { version = "0.13", default-features = false, features = ["tds80", "rustls", "chrono", "sql-browser-tokio"] }
tokio-util = { version = "0.7", features = ["compat"] }
futures-util = "0.3"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
keyring = "4"
sha2 = "0.10"
# MongoDB (Atlas, servidor/replica set, Azure Cosmos DB API Mongo).
mongodb = "3.9"
bson = "2.15"
rand = "0.9"
# Notas e pastas (notes.db): SQLite embutido no binário, com FTS5 para a busca.
rusqlite = { version = "0.40", features = ["bundled"] }
# RabbitMQ: AMQP 0-9-1 (captura ao vivo, mover/republicar com transação). A gestão usa a API HTTP do plugin de management (reqwest).
amqprs = { version = "2.1", features = ["tls"] }
amqp_serde = "0.4"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tauri-plugin-single-instance = "2"
# Redis (app "Redis"): standalone/Cluster/Sentinel com TLS (rustls); túnel SSH em Rust puro.
redis = { version = "1.8", default-features = false, features = ["tokio-rustls-comp", "tls-rustls-insecure", "cluster-async", "sentinel"] }
russh = { version = "0.64", default-features = false, features = ["ring", "rsa", "flate2"] }

# Exportar notas em PDF (note_pdf.rs): mesmas versões usadas pelo Tauri/wry. Prévia de .md com
# Espaço no Explorer (quicklook.rs): hook de teclado + Shell (IShellWindows/IFolderView2).
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Storage_EnhancedStorage", "Win32_System_Ole", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }
windows-core = "0.62"

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
webkit2gtk = "2.0"
gtk = "0.18"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# tiberius 0.13 com patch mínimo (vendor/tiberius, marcado "TodoRS patch"): expõe a contagem
# de cada comando (DONE + CurCmd) no QueryStream para "(N) registro(s) afetado(s)".
# Ao atualizar o tiberius, reaplicar o patch ou remover se a versão nova expuser isso.
#
# mongodb 3.9.1 com patch mínimo (vendor/mongodb, marcado "TodoRS patch"): aceita servidores
# MongoDB 3.6+ (wire 6), como o Azure Cosmos DB API 3.6; o upstream exige 4.4 (wire 9).
# Inclui a rodada final vazia do SCRAM, que servidores < 4.4 exigem (auth/scram.rs).
# Ao atualizar o mongodb, copiar a versão nova para vendor/ e reaplicar o patch.
[patch.crates-io]
tiberius = { path = "vendor/tiberius" }
mongodb = { path = "vendor/mongodb" }
