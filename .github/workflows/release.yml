name: "Publish Release"

on:
  push:
    tags:
      - "v*"
  # Manual: (re)publica os artefatos numa release que já existe (ex.: a v1.2.0 sem Linux)
  # ou cria uma nova. Nunca apaga releases nem tags: cada versão fica no histórico.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da release (ex.: v1.2.0)"
        required: true

# Um run por tag e sem cancelar o que já está rodando (um push novo não derruba o anterior).
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Histórico completo: o número da build (Configurações → Sobre) é a contagem de commits.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev

      # CLI `devsuite`: empacotada como externalBin (tauri.release.conf.json).
      - name: Build CLI (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: bash ./build_cli.sh

      - name: Build CLI (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: ./build_cli.ps1

      # Release notes: release-notes/<tag>.md (obrigatório a partir da v1.2.5; sem o arquivo, texto genérico).
      - name: Release notes
        id: notes
        shell: bash
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          FILE="release-notes/${TAG}.md"
          if [ -f "$FILE" ]; then
            echo "file=$FILE" >> "$GITHUB_OUTPUT"
            { echo "body<<__NOTES_EOF__"; cat "$FILE"; echo; echo "__NOTES_EOF__"; } >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Sem $FILE: a release sai com o texto genérico."
            echo "body=Confira as novidades e artefatos compilados para esta versão do Dev Suite!" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: "Dev Suite ${{ inputs.tag || github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: "--config src-tauri/tauri.release.conf.json ${{ matrix.args }}"

      # A tauri-action só define o texto ao criar a release: regrava a partir do arquivo
      # (vale também para o workflow manual sobre uma release que já existe).
      - name: Update release notes
        if: matrix.platform == 'ubuntu-22.04' && steps.notes.outputs.file != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ inputs.tag || github.ref_name }}" --repo "${{ github.repository }}" --notes-file "${{ steps.notes.outputs.file }}"
