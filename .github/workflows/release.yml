name: "Publish Release"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev

      # CLI `devsuite`: empacotada como externalBin (tauri.release.conf.json).
      - name: Build CLI (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: bash ./build_cli.sh

      - name: Build CLI (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: ./build_cli.ps1

      - name: Build and Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Dev Suite ${{ github.ref_name }}"
          releaseBody: "Confira as novidades e artefatos compilados para esta versão do Dev Suite!"
          releaseDraft: false
          prerelease: false
          args: "--config src-tauri/tauri.release.conf.json ${{ matrix.args }}"
